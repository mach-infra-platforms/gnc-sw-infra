name: terraform

# Source-validation guard only. Live terraform plan/apply, AWS credential
# configuration, and Terraform Cloud state/secret use are intentionally
# disabled while the unreconciled 3-update hold (Lambda ENV + two launch
# templates) is under owner review. There is no workflow_dispatch input,
# repository variable, or environment flag that re-enables plan/apply here;
# restoration requires a reviewed workflow change, not a runtime toggle.

on:
  pull_request:
    paths:
      - "aws-gov/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "aws-gov/**"
      - ".github/workflows/terraform.yml"

# Read-only source validation: no cloud credentials, no OIDC/id-token,
# no Terraform Cloud token, no environments.
permissions:
  contents: read

concurrency:
  # One workspace, one runner: preserve the existing single-run policy.
  group: terraform-polaris-sim
  cancel-in-progress: false

defaults:
  run:
    working-directory: aws-gov/dev/polaris-sim

jobs:
  validate:
    name: fmt-and-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      # Backend-disabled init: skips the TFC remote backend entirely (no state
      # access, no TFC token). It still fetches the declared providers
      # from the public registry for `terraform validate` schema checks.
      # The tracked lockfile pins AWS 6.58.0 and archive 2.8.0; readonly mode
      # preserves those selections. Offline readiness is not claimed.
      - name: Terraform Init (backend disabled)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate
