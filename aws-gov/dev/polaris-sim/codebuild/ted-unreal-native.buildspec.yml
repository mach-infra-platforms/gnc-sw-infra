{"version": 0.2, "env": {"shell": "bash"}, "phases": {"build": {"commands": ["set -euo pipefail\numask 077\nACCOUNT=$(aws sts get-caller-identity --query Account --output text)\nROLE=$(aws sts get-caller-identity --query Arn --output text)\n[ \"$ACCOUNT\" = \"393769260826\" ]\ncase \"$ROLE\" in arn:aws-us-gov:sts::393769260826:assumed-role/mach-gnc-polaris-sim-codebuild/*) ;; *) exit 11;; esac\npython3 - <<'VERIFY'\nimport json,hashlib,pathlib\np=pathlib.Path('.gnc-source-manifest.json');b=p.read_bytes()\nassert hashlib.sha256(b).hexdigest()=='3663569f8b7ef60cdab31978bf8faa369abc872563fae57da7f0367b3bc19fd8'\nm=json.loads(b);assert m['commit']=='b950ac0852b224e542c70903f85708a720072212'\nfor item in m['files']:\n f=pathlib.Path(item['path']);assert f.is_file() and not f.is_symlink();d=f.read_bytes()\n assert hashlib.sha1(b'blob '+str(len(d)).encode()+b'\\0'+d).hexdigest()==item['git_blob_sha'],item['path']\nprint('SOURCE_BLOBS_VERIFIED',len(m['files']),m['commit'])\nVERIFY\n[ \"$EPIC_GHCR_USER\" = \"lvonguyen-mach\" ]\n[ -n \"$EPIC_GHCR_TOKEN\" ]\nprintf '%s' \"$EPIC_GHCR_TOKEN\" | docker login ghcr.io -u \"$EPIC_GHCR_USER\" --password-stdin\nunset EPIC_GHCR_TOKEN\n[ ! -e polaris/unreal/rig ]\ncp -R polaris/deploy/rig polaris/unreal/rig\nIMAGE=393769260826.dkr.ecr.us-gov-west-1.amazonaws.com/mach-industries/mach-unreal\nTAG=b950ac0852b224e542c70903f85708a720072212\ndf -h /\ndocker info >/dev/null\ndocker build -f polaris/unreal/Dockerfile.generate -t \"$IMAGE:$TAG\" -t \"$IMAGE:latest\" polaris/unreal\n[ \"$(docker image inspect \"$IMAGE:$TAG\" --format '{{.Architecture}}')\" = amd64 ]\ndocker run --rm --entrypoint /bin/bash \"$IMAGE:$TAG\" -c 'test -x /opt/rig/entrypoint-unreal.sh && test -x /opt/rig/entrypoint-px4-sitl.sh && test -f /opt/rig/rig-runconfig.py && test -x /opt/rig/rig-common.sh && python3 -c \"import json,math,shlex\" && command -v mach-unreal && aws --version'\nACCOUNT=$(aws sts get-caller-identity --query Account --output text)\nROLE=$(aws sts get-